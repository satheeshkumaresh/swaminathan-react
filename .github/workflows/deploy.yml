# .github/workflows/deploy.yml
name: Deploy to EC2

on:
  push:
    branches: [ main ]  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          cd /var/www/html/swaminathan-react/
          git pull origin jenkins
          # Add any commands like build, restart services etc.
          sudo systemctl restart nginx
